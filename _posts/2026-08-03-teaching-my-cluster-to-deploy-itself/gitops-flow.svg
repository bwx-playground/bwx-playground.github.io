<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#f7f8fa" rx="12"/>

  <text x="450" y="35" text-anchor="middle" fill="#1a202c" font-size="15" font-weight="700">three repos, one deployment</text>

  <!-- Repo 1: chart source -->
  <rect x="40" y="65" width="230" height="80" rx="10" fill="#1a365d"/>
  <text x="155" y="92" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">k3s-raspi</text>
  <text x="155" y="110" text-anchor="middle" fill="#bee3f8" font-size="10.5">the "recipe" — a reusable</text>
  <text x="155" y="124" text-anchor="middle" fill="#bee3f8" font-size="10.5">Helm chart template</text>

  <!-- Repo 2: values -->
  <rect x="335" y="65" width="230" height="80" rx="10" fill="#22543d"/>
  <text x="450" y="92" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">k3s-raspi-service-deployment</text>
  <text x="450" y="110" text-anchor="middle" fill="#c6f6d5" font-size="10.5">the "order" — one folder</text>
  <text x="450" y="124" text-anchor="middle" fill="#c6f6d5" font-size="10.5">per app, just values</text>

  <!-- Repo 3: terraform -->
  <rect x="630" y="65" width="230" height="80" rx="10" fill="#553c9a"/>
  <text x="745" y="92" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">k3s-raspi-iac</text>
  <text x="745" y="110" text-anchor="middle" fill="#e9d8fd" font-size="10.5">the "manager" — decides</text>
  <text x="745" y="124" text-anchor="middle" fill="#e9d8fd" font-size="10.5">what's officially on the menu</text>

  <!-- Arrow from repo1 to zot -->
  <line x1="155" y1="145" x2="155" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="165" y="182" fill="#4a5568" font-size="10.5">helm push</text>
  <text x="165" y="195" fill="#4a5568" font-size="10.5">(versioned)</text>

  <!-- zot box -->
  <rect x="55" y="220" width="200" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="245" text-anchor="middle" fill="#1a202c" font-size="12.5" font-weight="600">zot registry</text>
  <text x="155" y="261" text-anchor="middle" fill="#4a5568" font-size="10">chart, sitting ready</text>

  <!-- Arrow from repo3 to argocd app -->
  <line x1="745" y1="145" x2="745" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="700" y="182" fill="#4a5568" font-size="10.5">terraform apply</text>
  <text x="713" y="195" fill="#4a5568" font-size="10.5">creates the watch</text>

  <!-- ArgoCD Application box -->
  <rect x="605" y="220" width="280" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="745" y="248" text-anchor="middle" fill="#1a202c" font-size="13" font-weight="600">ArgoCD Application</text>
  <text x="745" y="265" text-anchor="middle" fill="#7b341e" font-size="10.5">"watch these two things,</text>
  <text x="745" y="278" text-anchor="middle" fill="#7b341e" font-size="10.5">keep them in sync"</text>

  <!-- lines into ArgoCD from zot and repo2 -->
  <line x1="255" y1="247" x2="600" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="380" y="235" fill="#4a5568" font-size="10.5">chart @ version X</text>

  <line x1="450" y1="145" x2="620" y2="255" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="480" y="185" fill="#4a5568" font-size="10.5">this app's values</text>

  <!-- Arrow down to live cluster -->
  <line x1="745" y1="290" x2="745" y2="355" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="758" y="325" fill="#4a5568" font-size="10.5">renders + applies</text>

  <rect x="595" y="360" width="300" height="70" rx="10" fill="#2f855a"/>
  <text x="745" y="390" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">running on the cluster</text>
  <text x="745" y="408" text-anchor="middle" fill="#dcfce7" font-size="11">no SSH, no manual kubectl apply</text>

  <!-- Feedback loop -->
  <rect x="60" y="470" width="780" height="110" rx="10" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="498" text-anchor="middle" fill="#1a202c" font-size="12.5" font-weight="600">shipping a new version later</text>
  <text x="450" y="522" text-anchor="middle" fill="#4a5568" font-size="11">1. app's CI builds a new image, pushes it to zot</text>
  <text x="450" y="541" text-anchor="middle" fill="#4a5568" font-size="11">2. edit one line in the values file (the image tag), push to git</text>
  <text x="450" y="560" text-anchor="middle" fill="#4a5568" font-size="11">3. ArgoCD notices within minutes and redeploys — that's the whole workflow</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
